name: Validate Android emulator
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-emulator.yml
      - apps/mobile/**
      - packages/**
      - assets/**
      - scripts/smoke-android-emulator.mjs
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/android-emulator.yml
      - apps/mobile/**
      - packages/**
      - assets/**
      - scripts/smoke-android-emulator.mjs
      - pnpm-lock.yaml
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mobile
      - run: pnpm mobile:sync
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: apps/mobile/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and play on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: node scripts/smoke-android-emulator.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-sit-android-emulator
          path: ${{ runner.temp }}/compose-sit-emulator
